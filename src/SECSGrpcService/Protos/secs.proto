syntax = "proto3";

option csharp_namespace = "SECSGrpcService";

package GY.EFEM;

import "common.proto";

// 主动外发接口定义（本项目作为 gRPC Client）。
// 说明：本文件只定义本项目“向外部服务发起调用”的 RPC。
service EFEM {
  // 开始检测。
  rpc StartMeasurement (.GY.EFEM.StartMessage) returns (.GY.EFEM.ControlReply);

  // 停止检测。
  rpc StopMeasurement (.GY.EFEM.WaferMessage) returns (.GY.EFEM.ControlReply);

  // 暂停检测。
  rpc PauseMeasurement (.GY.EFEM.WaferMessage) returns (.GY.EFEM.ControlReply);

  // 恢复检测。
  rpc ResumeMeasurement (.GY.EFEM.WaferMessage) returns (.GY.EFEM.ControlReply);

  // 配方选择。
  rpc ProcessProgramSelect (.GY.EFEM.RecipeMessage) returns (.GY.EFEM.ControlReply);
}

// 报警相关主动外发服务。
service AlarmGrpcService {
  // 主动清除报警（报警恢复）。
  rpc ClearAlarm (.GY.EFEM.AlarmClearRequest) returns (.GY.EFEM.AlarmReply);

  // 主动查询当前激活报警。
  rpc QueryActiveAlarms (.GY.EFEM.QueryActiveAlarmsRequest) returns (.GY.EFEM.QueryActiveAlarmsReply);
}
