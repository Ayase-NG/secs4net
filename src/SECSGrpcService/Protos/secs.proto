syntax = "proto3";

option csharp_namespace = "SECSGrpcService";

package GY.EFEM;

import "common.proto";

// 主动外发接口定义（本项目作为 gRPC Client）。
// 说明：本文件的RPC均为主动外发，调用EFEM的server。
service EFEM {
  // 开始检测。
  rpc StartMeasurement (NoParams) returns (ControlReply);

  // 停止检测。需确认是否为指向性停止，还是立即停止。一般不考虑使用
  rpc StopMeasurement (WaferMessage) returns (ControlReply);

  // 暂停检测。
  rpc PauseMeasurement (WaferMessage) returns (ControlReply);

  // 恢复检测。
  rpc ResumeMeasurement (WaferMessage) returns (ControlReply);

  // 配方选择。
  rpc ProcessProgramSelect (RecipeMessage) returns (ControlReply);

  // 获取状态
  rpc StatusReport (NoParams) returns (StatusReply);
}

// 报警相关主动外发服务。
service AlarmGrpcService {
  // 清除报警（报警恢复）。
  rpc ClearAlarm (AlarmClearRequest) returns (AlarmReply);

  // 查询当前激活报警。
  rpc QueryActiveAlarms (QueryActiveAlarmsRequest) returns (QueryActiveAlarmsReply);
}
