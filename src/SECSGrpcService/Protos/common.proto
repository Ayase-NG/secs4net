syntax = "proto3";

option csharp_namespace = "SECSGrpcService";

package GY.EFEM;

// 通用消息定义（仅放可复用 message / enum，不放 service）。
// 由 `secs.proto`（主动外发）和 `efem.proto`（被动接收）共同引用。

// ===== EFEM 控制相关 =====

// 开始检测请求。
message StartMessage {
  // 请求发起方名称（模块名/设备名）。
  // string name = 1;

  // 批次 ID。
  string lotId = 2;

  // 选择测试模式，全自动00，半自动01，分拣02。
  string mode = 3;

  // 配方 ID（PPID）。开始中不携带PPID，由PP-SELECT下发
  // string PPID = 4;

  // 本次要处理的晶圆槽位列表。
  // repeated uint32 slotsList = 5;
}

message CarrierMessage {
  // Loadport位置。
  string portId = 1;
  // 批次 ID，暂时可不使用，即赋值可为"null"。
  string lotId = 2;
  // 晶圆盒标签 ID。
  string RFID = 3;
  // mapping结果。
  repeated uint32 slotsList = 5;
}

// 仅按 Port 触发的事件请求（例如花篮取走）。
message PortEventMessage {
  // Loadport位置。
  string portId = 1;
}

// S3F17 对应的槽位选择请求（与 PPSELECT 解耦）。
message SlotMapSelectMessage {
  // Loadport位置。
  string portId = 1;

  // 批次 ID。
  string lotId = 2;

  // Carrier ID。
  string carrierId = 3;

  // 本次要处理的晶圆槽位列表。
  repeated uint32 slotsList = 4;
}

// 晶圆上下文信息（用于停止/暂停/恢复/结果上报等）。
message WaferMessage {
  // 晶圆槽位。
  string slotId = 1;

  // 晶圆 ID。
  string waferId = 2;

  // 批次 ID。
  string lotId = 3;

  // 检测状态（Edge，Surface，completed）。
  string status = 4;

  // 配方 ID（PPID）。
  string PPID = 5;

  // 检测结果（建议由业务约定枚举值）。
  string result = 6;

  // 当前晶圆所属 Port（可选）。
  string portId = 7;
}

// 整盒晶圆检测完成上报。
message LotCompletedMessage {
  // Loadport位置。
  string portId = 1;

  // 批次 ID。
  string lotId = 2;

  // 完成状态（例如 Completed/Aborted/Error）。
  string status = 3;
}

// 通用事件上报（由 EFEM 传事件名 + 关键参数，本项目映射为 CEID 后再做 S6F11）。
message GenericEventReportRequest {
  // CEID（通过 CEID.csv 映射到 CEID）。
  uint32 CEID = 1;

  // 关键参数（键值对，键建议使用 CPName）。
  map<string, string> parameters = 2;
}

// 控制类接口通用响应。
message ControlReply {
  // 返回码：0=成功，其他=失败/异常。
  int32 messageCode = 1;

  // 返回信息。
  string Message = 2;
}

// 配方选择请求。下位机优先判断mode
message RecipeMessage {
  // 配方名称。
  string PPID = 1;

  // Loadport位置。有四个loadport例如：1011，仅134号port需要测试。
  string portId = 2;

  // 模式选择。00=全自动，01=半自动，02=分拣。
  string mode = 3;

  // 批次 ID（可选，按业务场景传）。
  string lotId = 4;

  // 本次要处理的晶圆槽位列表。
  repeated uint32 slotsList = 5;
}

// ===== 状态与上报相关 =====

// 状态上报请求。
message StatusMessage {
  // 状态来源（设备/模块）。
  string source = 1;
  // 状态代码。
  string statusCode = 2;
  // 状态文本。
  string statusText = 3;
  // 请求时间
  int64 reportedAtUnixMs = 4;
}

// 状态回复。
message StatusReply {
  // 返回码：0=成功，其他=失败/异常。
  int32 messageCode = 1;
  // 返回信息。
  string message = 2;
  // 运行模式。未设置00，全自动01，半自动02，分拣03。
  string mode = 3;
  // 运行状态。
  string runStatus = 4;
}

// 在线状态查询请求。
message OnlineStatusReply{
  // 返回码：0=成功，其他=失败/异常。
  int32 messageCode = 1;
  // 返回信息。
  string message = 2;
  // 在线状态：true=在线，false=离线。
  bool online = 3;
}

// ===== 报警与上报相关 =====

// 报警级别。
enum AlarmSeverity {
  // 未指定。
  UNSPECIFIED = 0;

  // 提示。
  INFO = 1;

  // 警告。
  WARNING = 2;

  // 错误。
  ERROR = 3;

  // 严重错误。
  CRITICAL = 4;
}

// 报警上报请求（报警发生）。
message AlarmReportRequest {
  // 报警来源（设备/模块）。
  string source = 1;

  // 报警标识符，实际的报警代码。
  uint32 alarmId = 2;

  // 报警代码，表示该报警的当前状态和严重程度。
  bytes alarmCode = 3;

  // 报警文本。
  string alarmText = 4;

  // 报警级别。
  AlarmSeverity severity = 5;

  // 发生时间（Unix 毫秒时间戳）。
  int64 occurredAtUnixMs = 6;
}

// 报警清除请求（报警恢复）。
message AlarmClearRequest {
  // 报警来源（设备/模块）。
  string source = 1;

  // 报警编号。
  uint32 alarmId = 2;

  // 清除原因。
  string clearReason = 3;

  // 清除时间（Unix 毫秒时间戳）。
  int64 clearedAtUnixMs = 4;
}

// 报警相关通用回复。
message AlarmReply {
  // 返回码：0=成功，其他=失败/异常。
  int32 messageCode = 1;

  // 返回信息。
  string message = 2;

  // 请求追踪 ID（可选）。
  string requestId = 3;
}

// 查询激活报警请求。
message QueryActiveAlarmsRequest {
  // 报警来源过滤（为空表示查询全部来源）。
  string source = 1;
}

// 激活报警条目。
message ActiveAlarm {
  // 报警来源。
  string source = 1;

  // 报警编号。
  uint32 alarmId = 2;

  // 报警代码（8位字节编码）。
  bytes alarmCode = 3;

  // 报警文本。
  string alarmText = 4;

  // 报警级别。
  AlarmSeverity severity = 5;

  // 发生时间（Unix 毫秒时间戳）。
  int64 occurredAtUnixMs = 6;
}

// 查询激活报警回复。
message QueryActiveAlarmsReply {
  // 返回码：0=成功，其他=失败/异常。
  int32 messageCode = 1;

  // 返回信息。
  string message = 2;

  // 当前激活报警列表。
  repeated ActiveAlarm alarms = 3;
}

// 结果上报回复。
message ReportReply {
    // 返回码：0=成功，其他=失败
      bool success = 1;
  // 用来识别不同情况，例如1002CEID时：2001为存在Job中，2002不存在。
  int32 code = 2;

  // 返回信息。
  string message = 3;
}

// 在线状态
message OnlineStatusRequest {
  // 请求来源（设备/模块）。
  string source = 1;
}

// 无参请求体
message NoParams{
}
