syntax = "proto3";


package GY.SECS;

import "common.proto";

// 被动接收接口定义（本项目作为 gRPC Server）。
// 说明：本文件的所有 RPC 均为被动接收，外部系统调用本项目的 server。

// 结果上报服务。
service ReportGrpcService {
	// 设备获取晶圆盒后，Mapping结束后上报RFID和Mapping结果。
	rpc ReportRFID (.GY.EFEM.CarrierMessage) returns (.GY.EFEM.ReportReply);

	// 上报花篮取走事件（仅传 PORTID，由中间件补齐上下文）。
	rpc ReportCarrierRemoved (.GY.EFEM.PortEventMessage) returns (.GY.EFEM.ReportReply);
	
	// 上报检测结果。（暂不启用，通过ReportEvent代替）
	//rpc ResultReport (.GY.EFEM.WaferMessage) returns (.GY.EFEM.ReportReply);

	// 上报整盒晶圆检测完成。
	rpc ReportLotCompleted (.GY.EFEM.LotCompletedMessage) returns (.GY.EFEM.ReportReply);

	// 通用事件上报（事件名 + 参数）。
	rpc ReportEvent (.GY.EFEM.GenericEventReportRequest) returns (.GY.EFEM.ReportReply);

	// 上报报警（报警发生）。
	rpc ReportAlarm (.GY.EFEM.AlarmReportRequest) returns (.GY.EFEM.AlarmReply);

	// 请求远程在线状态。
	rpc RequestOnlineStatus (.GY.EFEM.OnlineStatusRequest) returns (.GY.EFEM.OnlineStatusReply);
}

