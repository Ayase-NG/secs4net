syntax = "proto3";

option csharp_namespace = "SECSGrpcService";

package GY.EFEM;

import "common.proto";

// 被动接收接口定义（本项目作为 gRPC Server）。
// 说明：本文件存放“外部系统调用本项目”的所有 RPC。

// 结果上报服务。
service ReportGrpcService {
  // 外部上报检测结果。
  rpc ResultReport (WaferMessage) returns (ReportReply);

  // 外部上报报警（报警发生）。
  rpc ReportAlarm (AlarmReportRequest) returns (AlarmReply);
}

